<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер объявлений</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключение Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ВСТАВЬТЕ СЮДА ВАШ КОНФИГ ИЗ FIREBASE
         const firebaseConfig = {
    apiKey: "AIzaSyA3xBY633zOFgmDtoESeTZAviXGoRAKQnQ",
    authDomain: "avito-manager-3a84b.firebaseapp.com",
    projectId: "avito-manager-3a84b",
    storageBucket: "avito-manager-3a84b.firebasestorage.app",
    messagingSenderId: "205598987349",
    appId: "1:205598987349:web:d8ae2abe3fc8c9ba1f70dc"
  };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.db = db;
        window.auth = auth;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
        window.signInAnonymously = signInAnonymously;
    </script>
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>📋 Менеджер объявлений</h1>
        <div id="sync-status">Подключение...</div>
    </header>

    <main>
        <section class="card">
            <div class="card-header">
                <h2>👤 Аккаунты</h2>
                <button class="btn-add">+ Добавить</button>
            </div>
            <div id="accounts-list" class="list-container">
                <p style="color: #888;">Здесь будут аккаунты</p>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <h2>📝 База текстов</h2>
                <button class="btn-add">+ Добавить</button>
            </div>
            <div id="templates-list" class="list-container">
                <p style="color: #888;">Здесь будут тексты</p>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <h2>📊 Матрица размещений</h2>
            </div>
            <div id="matrix-container" class="matrix-wrapper">
                <!-- Сюда будет генерироваться таблица -->
            </div>
        </section>
    </main>
        <!-- Модальное окно для добавления и редактирования -->
    <dialog id="edit-modal">
        <form method="dialog">
            <h2 id="modal-title">Добавить</h2>
            
            <div id="field-1-group" style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px;">
                <label id="label-1" style="font-weight: 600; font-size: 0.9rem;">Название</label>
                <input type="text" id="field-1" required style="padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;">
            </div>

            <div id="field-2-group" style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px;">
                <label id="label-2" style="font-weight: 600; font-size: 0.9rem;">Текст</label>
                <textarea id="field-2" rows="12" required style="padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; resize: vertical;"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="document.getElementById('edit-modal').close()" style="padding: 10px 15px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer;">Отмена</button>
                <button type="button" onclick="window.saveModal()" style="padding: 10px 15px; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; font-weight: bold;">Сохранить</button>
            </div>
        </form>
    </dialog>
</body>
</html>
