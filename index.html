<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Менеджер объявлений</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="logo">📋</span>
            <span class="brand-name">Менеджер</span>
        </div>
        <nav class="tabs" id="main-tabs" role="tablist"></nav>
        <div class="header-right">
            <span id="sync-status" class="sync-pill sync-connecting" title="Статус синхронизации">Подключение…</span>
            <button class="btn-icon" id="btn-theme" title="Тема">🌙</button>
            <button class="btn-icon" id="btn-export" title="Экспорт базы">📥</button>
            <label class="btn-icon" title="Импорт базы">
                📤 <input type="file" id="import-file" accept=".json" hidden>
            </label>
        </div>
    </header>

    <main id="app-main"></main>

    <div id="toasts" class="toasts"></div>
    <dialog id="modal" class="modal"></dialog>

    <script type="module" src="js/main.js"></script>
</body>
</html>
